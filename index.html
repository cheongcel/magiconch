<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마법의 소라고동</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg0:#0a0a0a;
    --lcd-lightest:#9bbc0f;
    --lcd-light:#8bac0f;
    --lcd-dark:#306230;
    --lcd-darkest:#0f380f;
    --gold-lightest:#f5e6a8;
    --gold-light:#e8c26a;
    --gold-dark:#8a6a1f;
    --gold-darkest:#4a3510;
    --rare-lightest:#cfe3ee;
    --rare-light:#8fb8d6;
    --rare-dark:#345066;
    --rare-darkest:#141f2b;
    --veryrare-lightest:#ddc9f0;
    --veryrare-light:#a97fd1;
    --veryrare-dark:#402a52;
    --veryrare-darkest:#1c1226;
    --super-lightest:#f0c9e6;
    --super-light:#c85fc0;
    --super-dark:#4a1a45;
    --super-darkest:#1f0a1c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg0);
    color:#6b7a5e;
    font-family:'Press Start 2P',monospace;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    padding:24px 16px;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    position:relative;
    overflow:hidden;
  }
  /* scanline / secret-terminal texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  .prompt{font-size:10px;letter-spacing:.02em;color:#556347;display:flex;align-items:center;gap:2px}
  .prompt .cursor{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .device{
    position:relative;
    width:min(272px,76vw);
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    border-radius:6px;
  }
  .device:focus-visible{outline:2px solid var(--lcd-light);outline-offset:6px}

  .ring{position:absolute;inset:0;z-index:1;pointer-events:none}
  .tick{position:absolute;width:6px;height:6px;background:#26311c;
    transform:translate(-50%,-50%);transition:background-color .05s linear}
  .tick.lit{background:var(--lcd-light);box-shadow:0 0 5px var(--lcd-light)}

  .screen{
    position:relative;z-index:2;
    width:58%;aspect-ratio:1/1;
    background:var(--lcd-lightest);
    border:3px solid #1c1c1c;
    border-radius:10px;
    box-shadow:inset 0 0 0 2px #3a3a3a, 0 0 0 3px #050505;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    padding:8px;
  }
  .device.pressed .screen{transform:translateY(1px)}

  .sprite-grid{
    display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(16,1fr);
    width:72%;aspect-ratio:1/1;
  }
  .px{width:100%;height:100%}
  .px.A{background:var(--lcd-darkest)}
  .px.B{background:var(--lcd-light)}
  .px.C{background:var(--lcd-dark)}
  .px.E{background:var(--lcd-darkest)}
  .px.E.blink{background:transparent}
  .px.dot{background:transparent}

  .device.listening .sprite-grid{animation:jiggle .15s linear infinite}
  @keyframes jiggle{0%{transform:translateX(-1px)}50%{transform:translateX(1px)}100%{transform:translateX(-1px)}}

  /* 레어 골든 답변 */
  .device.golden .screen{
    background:var(--gold-lightest);
    box-shadow:inset 0 0 0 2px #3a3a3a, 0 0 0 3px #050505, 0 0 18px rgba(232,194,106,.75);
    transition:background-color .25s ease, box-shadow .25s ease;
  }
  .device.golden .px.A,.device.golden .px.E{background:var(--gold-darkest)}
  .device.golden .px.B{background:var(--gold-light)}
  .device.golden .px.C{background:var(--gold-dark)}
  .device.golden .tick.lit{background:var(--gold-light);box-shadow:0 0 6px var(--gold-light)}
  .device.golden .answer{color:var(--gold-darkest)}

  .flare{position:absolute;width:4px;height:4px;background:var(--gold-light);
    opacity:0;pointer-events:none;z-index:3}
  .flare1{top:6%;left:10%}
  .flare2{top:12%;right:8%}
  .flare3{bottom:8%;left:14%}
  .flare4{bottom:14%;right:12%}
  .device.golden .flare,.device.tier-rare .flare,.device.tier-veryrare .flare,.device.tier-super .flare{
    animation:flarePop 1.1s ease-in-out}
  .device.golden .flare2,.device.tier-rare .flare2,.device.tier-veryrare .flare2,.device.tier-super .flare2{animation-delay:.15s}
  .device.golden .flare3,.device.tier-rare .flare3,.device.tier-veryrare .flare3,.device.tier-super .flare3{animation-delay:.3s}
  .device.golden .flare4,.device.tier-rare .flare4,.device.tier-veryrare .flare4,.device.tier-super .flare4{animation-delay:.45s}
  @keyframes flarePop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(.3)}}

  /* RARE */
  .device.tier-rare .screen{
    background:var(--rare-lightest);
    box-shadow:inset 0 0 0 2px #3a3a3a, 0 0 0 3px #050505, 0 0 14px rgba(143,184,214,.65);
    transition:background-color .25s ease, box-shadow .25s ease;
  }
  .device.tier-rare .px.A,.device.tier-rare .px.E{background:var(--rare-darkest)}
  .device.tier-rare .px.B{background:var(--rare-light)}
  .device.tier-rare .px.C{background:var(--rare-dark)}
  .device.tier-rare .tick.lit{background:var(--rare-light);box-shadow:0 0 6px var(--rare-light)}
  .device.tier-rare .answer{color:var(--rare-darkest)}
  .device.tier-rare .flare{background:var(--rare-light)}

  /* VERY RARE */
  .device.tier-veryrare .screen{
    background:var(--veryrare-lightest);
    box-shadow:inset 0 0 0 2px #3a3a3a, 0 0 0 3px #050505, 0 0 18px rgba(169,127,209,.75);
    transition:background-color .25s ease, box-shadow .25s ease;
  }
  .device.tier-veryrare .px.A,.device.tier-veryrare .px.E{background:var(--veryrare-darkest)}
  .device.tier-veryrare .px.B{background:var(--veryrare-light)}
  .device.tier-veryrare .px.C{background:var(--veryrare-dark)}
  .device.tier-veryrare .tick.lit{background:var(--veryrare-light);box-shadow:0 0 6px var(--veryrare-light)}
  .device.tier-veryrare .answer{color:var(--veryrare-darkest)}
  .device.tier-veryrare .flare{background:var(--veryrare-light)}

  /* SUPER RARE - 살짝 깜빡이는 글리치 연출 */
  .device.tier-super .screen{
    background:var(--super-lightest);
    box-shadow:inset 0 0 0 2px #3a3a3a, 0 0 0 3px #050505, 0 0 22px rgba(200,95,192,.85);
    transition:background-color .25s ease, box-shadow .25s ease;
    animation:superFlicker 1.6s steps(1) infinite;
  }
  .device.tier-super .px.A,.device.tier-super .px.E{background:var(--super-darkest)}
  .device.tier-super .px.B{background:var(--super-light)}
  .device.tier-super .px.C{background:var(--super-dark)}
  .device.tier-super .tick.lit{background:var(--super-light);box-shadow:0 0 7px var(--super-light)}
  .device.tier-super .answer{color:var(--super-darkest)}
  .device.tier-super .flare{background:var(--super-light)}
  @keyframes superFlicker{
    0%,44%,52%,100%{filter:brightness(1)}
    46%{filter:brightness(1.35)}
    49%{filter:brightness(.82)}
  }

  .answer{
    font-family:'Courier New',monospace;
    font-size:11px;line-height:1.7;color:var(--lcd-darkest);
    text-align:center;min-height:34px;width:100%;
    word-break:keep-all;overflow-wrap:break-word;
    display:flex;align-items:center;justify-content:center;
  }
  .answer .caret{animation:blink .6s step-end infinite}

  .status{font-family:'Courier New',monospace;font-size:11px;color:#556347;letter-spacing:.02em;min-height:14px;text-align:center}

  .share-btn{
    margin-top:2px;
    font-family:'Press Start 2P',monospace;
    font-size:8px;letter-spacing:.06em;
    color:#556347;background:transparent;
    border:1px solid #33422b;border-radius:4px;
    padding:7px 12px;cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease,border-color .2s,color .2s;
  }
  .share-btn.show{opacity:1;pointer-events:auto}
  .share-btn:hover{border-color:var(--lcd-light);color:var(--lcd-light)}
  .share-btn:active{transform:translateY(1px)}
  .share-btn:focus-visible{outline:2px solid var(--lcd-light);outline-offset:3px}

  .mystery-badge{
    position:absolute;top:-10px;right:-6px;z-index:4;
    font-family:'Press Start 2P',monospace;
    font-size:10px;color:var(--gold-light);
    text-shadow:0 0 6px rgba(232,194,106,.8);
    animation:mysteryPulse 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes mysteryPulse{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}

  @media (prefers-reduced-motion: reduce){
    .device.listening .sprite-grid{animation:none}
    .prompt .cursor,.answer .caret{animation:none}
    .flare{animation:none}
    .mystery-badge{animation:none}
    .device.tier-super .screen{animation:none}
  }
</style>
</head>
<body>
  <p class="prompt">&gt; secret_oracle.exe<span class="cursor">_</span></p>

  <div class="device" id="device" role="button" tabindex="0" aria-label="소라고동 누르기">
    <div class="ring" id="ring"></div>
    <span class="flare flare1" aria-hidden="true"></span>
    <span class="flare flare2" aria-hidden="true"></span>
    <span class="flare flare3" aria-hidden="true"></span>
    <span class="flare flare4" aria-hidden="true"></span>
    <div class="screen">
      <div class="sprite-grid" id="sprite"></div>
      <div class="answer" id="answer"></div>
    </div>
  </div>

  <p class="status" id="status">눌러서 물어보기</p>
  <button class="share-btn" id="shareBtn" type="button">SHARE</button>

    "상대방한테 시간을 줘.","너 자신한테 시간을 줘.","오늘은 아무것도 하지 마.",
    "오늘 안에 행동해.","내일이면 답이 달라질 수 있어.","처음 떠오른 사람이 중요해.",
    "예상 밖의 곳에서 답을 찾게 될 거야.","결국 너한테 도움이 될 거야.","이건 지나가는 과정이야.",
    "아직 이야기가 끝나지 않았어.","한 번 펼친 답을 믿어봐."
  ];

  // GOLDEN (기본 5%, 새벽 3시엔 확률 상승)
  const goldenPool = [
    "오늘, 특별한 일이 생긴다.","지금 이 순간을 기억해둬.","우주가 네 편이야.",
    "이건 진짜야. 믿어도 돼.","행운이 오늘 너를 찾아왔어.","네가 바라던 그 일, 이루어진다.",
    "지금 이 느낌 그대로 밀고 나가.","오늘은 특별히, 다 잘될 거야.","네가 찾던 답, 바로 눈앞에 있어.",
    "오늘 하루, 특별히 잘 풀린다.","지금 이 마음, 틀리지 않았어.","작은 기적이 곧 일어나."
  ];

  // RARE
  const rarePool = [
    "조금 있으면 이유를 알게 돼.","지금 생각난 사람을 기억해.","두 번째 기회가 와.",
    "생각보다 가까이 있어.","오늘은 우연을 그냥 넘기지 마.","네가 모르는 곳에서 일이 움직이고 있어.",
    "그 사람이 먼저 움직일 거야.","처음 느낀 게 맞았어.","곧 같은 말을 다른 곳에서 듣게 될 거야.",
    "한 번 지나간 기회가 다시 와.","예상하지 못한 사람이 답을 가져올 거야.","아직 끝난 일이 아니야.",
    "조금 늦게 알게 될 뿐이야."
  ];

  // VERY RARE
  const veryRarePool = [
    "지금 시간을 기억해 둬.","아직 만나지 않은 사람이 관련돼 있어.","네가 잊은 건 없어지지 않았어.",
    "곧 상황이 완전히 다르게 보일 거야.","한 사람이 너를 예상보다 오래 기억하고 있어.","결정적인 건 네가 듣지 못한 말이야.",
    "지금은 아무것도 없는 것처럼 보여도 달라질 거야.","예전에 끝났다고 생각한 일이 다시 이어져.","너보다 먼저 결정을 내린 사람이 있어.",
    "곧 누군가의 태도가 달라질 거야."
  ];

  // SUPER RARE
  const superRarePool = [
    "그 일은 이미 시작됐어.","방금 떠오른 건 잊지 마.","그 이름은 아직 끝나지 않았어.",
    "네가 모르는 답이 이미 정해져 있어.","곧 설명되지 않는 우연이 한 번 더 생겨.","다음에 같은 장면을 보면 멈춰.",
    "네가 선택하지 않은 쪽도 아직 남아 있어.","한 번 사라진 것이 다시 나타나.","지금은 모르는 편이 더 좋아.",
    "그 사람이 먼저 알아차릴 거야.","아직 아무 일도 없었다고 생각하지 마.","가장 최근에 포기한 것을 다시 보게 돼.",
    "네가 기다리는 소식은 예상한 곳에서 오지 않아.","곧 처음 보는 사람이 익숙하게 느껴질 거야.","네가 우연이라고 넘긴 것 중 하나는 우연이 아니야.",
    "한 사람은 네가 생각하는 것보다 가까이 있어.","이번에는 뒤늦게 의미를 알게 돼.","같은 숫자를 다시 보면 기억해 둬.",
    "오늘 들은 말 하나가 나중에 다시 돌아와.","네가 피한 선택이 다시 나타날 거야.","한 번 더 같은 일이 생기면 그때는 믿어.",
    "네가 찾고 있는 건 이미 방향을 바꿨어.","곧 누군가가 예상하지 못한 질문을 할 거야.","그 순간에는 첫 번째 생각대로 해."
  ];

  // 16x16 pixel sprite map: . transparent, A outline, B body, C shade, E eye
  const SPRITE = [
    "................",
    ".....AAAAAA.....",
    "...AABBBBBBAA...",
    "..ABBBBBBBBBBA..",
    ".ABBEBBBBBBEBBA.",
    ".ABBBBBBBBBBBBA.",
    "ABBBBCCCCBBBBBBA",
    "ABBBCCAACCBBBBBA",
    "ABBBCAAAACBBBBBA",
    "ABBBBCCCCBBBBBBA",
    ".ABBBBBBBBBBBBA.",
    ".ABBBBBBBBBBBBA.",
    "..ABBBBBBBBBBA..",
    "...AABBBBBBAA...",
    ".....AAAAAA.....",
    "................"
  ];
  // 밤(21시~06시)엔 눈을 감고 있음
  const SPRITE_SLEEPY = [
    "................",
    ".....AAAAAA.....",
    "...AABBBBBBAA...",
    "..ABBBBBBBBBBA..",
    ".ABAABBBBBAABBA.",
    ".ABBBBBBBBBBBBA.",
    "ABBBBCCCCBBBBBBA",
    "ABBBCCAACCBBBBBA",
    "ABBBCAAAACBBBBBA",
    "ABBBBCCCCBBBBBBA",
    ".ABBBBBBBBBBBBA.",
    ".ABBBBBBBBBBBBA.",
    "..ABBBBBBBBBBA..",
    "...AABBBBBBAA...",
    ".....AAAAAA.....",
    "................"
  ];
  // 아주 가끔, 아무 이유 없이 윙크하고 있는 채로 로드됨
  const SPRITE_WINK = [
    "................",
    ".....AAAAAA.....",
    "...AABBBBBBAA...",
    "..ABBBBBBBBBBA..",
    ".ABAABBBBBBEBBA.",
    ".ABBBBBBBBBBBBA.",
    "ABBBBCCCCBBBBBBA",
    "ABBBCCAACCBBBBBA",
    "ABBBCAAAACBBBBBA",
    "ABBBBCCCCBBBBBBA",
    ".ABBBBBBBBBBBBA.",
    ".ABBBBBBBBBBBBA.",
    "..ABBBBBBBBBBA..",
    "...AABBBBBBAA...",
    ".....AAAAAA.....",
    "................"
  ];

  const now = new Date();
  const hour = now.getHours();
  const isNight = hour >= 21 || hour < 6;
  const isMysteryHour = hour === 3;

  let activeSprite = SPRITE;
  if(isNight){
    activeSprite = SPRITE_SLEEPY;
  } else if(Math.random() < 0.1){
    activeSprite = SPRITE_WINK; // 가끔, 아무것도 안 했는데 표정이 다름
  }

  const spriteEl = document.getElementById('sprite');
  const eyeCells = [];
  activeSprite.forEach(row=>{
    row.split('').forEach(ch=>{
      const d = document.createElement('div');
      d.className = 'px ' + (ch === '.' ? 'dot' : ch);
      if(ch === 'E') eyeCells.push(d);
      spriteEl.appendChild(d);
    });
  });

  // 새벽 3시에만 나타나는 ??? 뱃지 (모든 희귀 등급 확률이 이 시간엔 올라감)
  let goldenChance = 0.05, rareChance = 0.05, veryRareChance = 0.025, superChance = 0.01;
  if(isMysteryHour){
    goldenChance = 0.3; rareChance = 0.2; veryRareChance = 0.1; superChance = 0.05;
    const badge = document.createElement('span');
    badge.className = 'mystery-badge';
    badge.textContent = '???';
    document.getElementById('device').appendChild(badge);
  }

  // blink eyes periodically (자고 있으면 눈이 이미 감겨 있으니 깜빡이지 않음)
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced && !isNight){
    setInterval(()=>{
      eyeCells.forEach(e=>e.classList.add('blink'));
      setTimeout(()=> eyeCells.forEach(e=>e.classList.remove('blink')), 140);
    }, 3600);
  }

  // 8비트 효과음 (Web Audio, 외부 파일 없음)
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type, gainVal, delay){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal || 0.05, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  // ring ticks
  const ringEl = document.getElementById('ring');
  const TICK_COUNT = 28;
  const ticks = [];
  function layoutTicks(){
    ringEl.innerHTML = '';
    ticks.length = 0;
    const box = document.getElementById('device').getBoundingClientRect();
    const cx = box.width/2, cy = box.height/2;
    const r = box.width/2 - 3;
    for(let i=0;i<TICK_COUNT;i++){
      const angle = (i/TICK_COUNT) * Math.PI*2 - Math.PI/2;
      const x = cx + Math.cos(angle)*r;
      const y = cy + Math.sin(angle)*r;
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.left = x+'px';
      t.style.top = y+'px';
      ringEl.appendChild(t);
      ticks.push(t);
    }
  }
  layoutTicks();
  window.addEventListener('resize', layoutTicks);

  function setTicks(count){
    ticks.forEach((t,i)=> t.classList.toggle('lit', i < count));
  }

  const device = document.getElementById('device');
  const statusEl = document.getElementById('status');
  const answerEl = document.getElementById('answer');
  const shareBtn = document.getElementById('shareBtn');
  const DEFAULT_STATUS = '눌러서 물어보기';
  const HOLD_MS = reduced ? 160 : 1000;

  let holding = false, busy = false, startTime = 0, rafId = null, lastTickN = -1;
  let lastAnswerText = '', lastTier = 'common';

  function frame(ts){
    if(!holding) return;
    const elapsed = ts - startTime;
    const frac = Math.min(1, elapsed/HOLD_MS);
    const n = Math.round(frac * TICK_COUNT);
    if(n !== lastTickN){
      lastTickN = n;
      setTicks(n);
      if(!reduced && n > 0 && n % 4 === 0){
        beep(260 + frac*380, 0.045, 'square', 0.03);
      }
    }
    if(frac >= 1){ finishListen(); return; }
    rafId = requestAnimationFrame(frame);
  }

  function startListen(){
    if(busy) return;
    busy = true; holding = true; lastTickN = 0;
    device.classList.add('listening','pressed');
    answerEl.textContent = '';
    statusEl.textContent = '듣는 중...';
    shareBtn.classList.remove('show');
    startTime = performance.now();
    if(!reduced) beep(180, 0.05, 'square', 0.035);
    rafId = requestAnimationFrame(frame);
  }

  function cancelListen(){
    if(!holding) return;
    holding = false; busy = false;
    cancelAnimationFrame(rafId);
    device.classList.remove('listening','pressed');
    setTicks(0);
    if(!reduced) beep(140, 0.08, 'square', 0.03);
    statusEl.textContent = '다시 눌러봐';
    setTimeout(()=>{ if(!holding) statusEl.textContent = DEFAULT_STATUS; }, 1200);
  }

  function typeOut(text){
    let i = 0;
    answerEl.innerHTML = '<span class="txt"></span><span class="caret">_</span>';
    const txtEl = answerEl.querySelector('.txt');
    const speed = reduced ? 0 : 32;
    function step(){
      if(i < text.length){
        txtEl.textContent += text[i];
        i++;
        setTimeout(step, speed);
      } else {
        const c = answerEl.querySelector('.caret');
        if(c) c.remove();
      }
    }
    step();
  }

  const TIER_POOLS = {common: pool, rare: rarePool, veryrare: veryRarePool, super: superRarePool, golden: goldenPool};
  const TIER_CLASS = {rare: 'tier-rare', veryrare: 'tier-veryrare', super: 'tier-super', golden: 'golden'};
  const TIER_VISIBLE_MS = {common: 900, rare: 1500, veryrare: 2000, super: 2400, golden: 2600};

  function pickTier(){
    const r = Math.random();
    let acc = 0;
    if(r < (acc += superChance)) return 'super';
    if(r < (acc += veryRareChance)) return 'veryrare';
    if(r < (acc += rareChance)) return 'rare';
    if(r < (acc += goldenChance)) return 'golden';
    return 'common';
  }

  function playTierSound(tier){
    if(reduced) return;
    if(tier === 'golden'){
      beep(523.25,0.14,'triangle',0.05,0);
      beep(659.25,0.14,'triangle',0.05,0.09);
      beep(783.99,0.14,'triangle',0.05,0.18);
      beep(1046.50,0.22,'triangle',0.05,0.27);
    } else if(tier === 'super'){
      beep(698.46,0.16,'sine',0.05,0);
      beep(587.33,0.16,'sine',0.05,0.12);
      beep(523.25,0.16,'sine',0.05,0.24);
      beep(466.16,0.26,'sine',0.05,0.36);
    } else if(tier === 'veryrare'){
      beep(440.00,0.14,'sine',0.045,0);
      beep(554.37,0.14,'sine',0.045,0.1);
      beep(659.25,0.2,'sine',0.045,0.2);
    } else if(tier === 'rare'){
      beep(440.00,0.14,'sine',0.045,0);
      beep(523.25,0.2,'sine',0.045,0.11);
    } else {
      beep(523.25,0.12,'square',0.04,0);
      beep(659.25,0.16,'square',0.04,0.09);
    }
  }

  function finishListen(){
    holding = false;
    cancelAnimationFrame(rafId);
    device.classList.remove('listening');
    device.classList.remove('pressed');
    statusEl.textContent = '...';

    const tier = pickTier();
    const tierPool = TIER_POOLS[tier];
    const text = tierPool[Math.floor(Math.random()*tierPool.length)];
    lastAnswerText = text;
    lastTier = tier;

    const cls = TIER_CLASS[tier];
    if(cls) device.classList.add(cls);
    playTierSound(tier);

    typeOut(text);
    setTimeout(()=>{
      setTicks(0);
      busy = false;
      statusEl.textContent = DEFAULT_STATUS;
      if(cls) device.classList.remove(cls);
      shareBtn.classList.add('show');
    }, TIER_VISIBLE_MS[tier]);
  }

  device.addEventListener('pointerdown', function(e){
    e.preventDefault();
    startListen();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
    device.addEventListener(evt, cancelListen);
  });
  device.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if(!busy) startListen();
    }
  });

  // ── 정사각 이미지로 공유 ──
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapText(ctx, text, maxWidth){
    const lines = [];
    let line = '';
    for(const ch of text){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if(line) lines.push(line);
    return lines;
  }
  const SHARE_TIER_COLORS = {
    common:   {bg:'#9bbc0f', A:'#0f380f', B:'#8bac0f', C:'#306230'},
    rare:     {bg:'#cfe3ee', A:'#141f2b', B:'#8fb8d6', C:'#345066'},
    veryrare: {bg:'#ddc9f0', A:'#1c1226', B:'#a97fd1', C:'#402a52'},
    super:    {bg:'#f0c9e6', A:'#1f0a1c', B:'#c85fc0', C:'#4a1a45'},
    golden:   {bg:'#f5e6a8', A:'#4a3510', B:'#e8c26a', C:'#8a6a1f'}
  };
  function renderShareCanvas(text, tier){
    const colors = SHARE_TIER_COLORS[tier] || SHARE_TIER_COLORS.common;
    const size = 360;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0,0,size,size);

    const bezel = 34;
    ctx.fillStyle = '#141414';
    roundRect(ctx, bezel, bezel, size-bezel*2, size-bezel*2, 16); ctx.fill();

    const pad = 26;
    const sx = bezel+pad, sy = bezel+pad, sw = size-bezel*2-pad*2, sh = sw;
    ctx.fillStyle = colors.bg;
    roundRect(ctx, sx, sy, sw, sh, 10); ctx.fill();
    ctx.strokeStyle = '#1c1c1c'; ctx.lineWidth = 4;
    roundRect(ctx, sx, sy, sw, sh, 10); ctx.stroke();

    const palette = {A:colors.A, B:colors.B, C:colors.C, E:colors.A};
    const cell = (sw*0.66)/16;
    const spX = sx + (sw - cell*16)/2;
    const spY = sy + sh*0.12;
    activeSprite.forEach((row,ry)=>{
      row.split('').forEach((ch,rx)=>{
        if(ch === '.') return;
        ctx.fillStyle = palette[ch];
        ctx.fillRect(spX+rx*cell, spY+ry*cell, cell+0.6, cell+0.6);
      });
    });

    ctx.fillStyle = colors.A;
    ctx.font = "13px 'Press Start 2P', monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = wrapText(ctx, text, sw*0.84);
    const lineH = 19;
    let ty = spY + cell*16 + 30;
    lines.forEach((ln,i)=> ctx.fillText(ln, sx+sw/2, ty + i*lineH));

    ctx.fillStyle = '#556347';
    ctx.font = "9px 'Press Start 2P', monospace";
    ctx.fillText('MAGIC CONCH', size/2, size-20);

    return canvas.toDataURL('image/png');
  }

  async function shareAnswer(){
    if(!lastAnswerText) return;
    const dataUrl = renderShareCanvas(lastAnswerText, lastTier);
    // 실제 웹 주소(http/https)에 호스팅된 경우에만 링크를 함께 보냄
    const shareUrl = location.protocol.indexOf('http') === 0 ? location.href : '';
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], 'magic-conch.png', {type:'image/png'});
      const shareData = {files:[file], title:'마법의 소라고동', text: lastAnswerText};
      if(shareUrl) shareData.url = shareUrl;
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share(shareData);
        return;
      }
    }catch(err){ /* 사용자 취소 등 → 아래 대체 동작으로 진행 */ }
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'magic-conch.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    if(navigator.clipboard){
      const clipText = '🐚 ' + lastAnswerText + (shareUrl ? ('\n' + shareUrl) : '');
      try{ await navigator.clipboard.writeText(clipText); }catch(e){}
    }
    const prev = statusEl.textContent;
    statusEl.textContent = '이미지 저장됨';
    setTimeout(()=>{ statusEl.textContent = prev === '이미지 저장됨' ? DEFAULT_STATUS : prev; }, 1400);
  }
  shareBtn.addEventListener('click', shareAnswer);
})();
</script>
